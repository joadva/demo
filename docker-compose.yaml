# MySQL local para correr el CRUD de /clientes sin tocar AWS.
#
#   docker compose up -d        # levanta y carga sql/ la primera vez
#   npm run demo                # ejecuta el CRUD completo contra ella
#   docker compose down -v      # la destruye (incluidos los datos)
#
# Los scripts de sql/ solo se ejecutan cuando el volumen esta vacio. Si cambias
# un stored procedure, vuelve a aplicarlos con `npm run db:init` o baja el
# contenedor con -v para que arranque limpio.
services:
  mysql:
    image: mysql:8.4
    container_name: demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    volumes:
      - ./sql/clientes.sql:/docker-entrypoint-initdb.d/01-clientes.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - demo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udemo", "-pdemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  demo-mysql-data:
