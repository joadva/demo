openapi: 3.0.0
info:
  version: 1.0.0
  title: Demo
  description: Demo Global definitions of AWS SecretsManager
  contact:
    name: Demo

tags:
  - name: Tool
    description: Tool endpoints
  - name: Clientes
    description: CRUD de ejemplo sobre la tabla clientes vía stored procedures

servers:
  - url: https://x1orn0jhw1.execute-api.us-east-1.amazonaws.com/api
    description: QA

x-amazon-apigateway-request-validators:
  Validate body, query string parameters, and headers:
    validateRequestParameters: true
    validateRequestBody: true

x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{ "message": "$context.error.validationErrorString" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
  UNAUTHORIZED:
    statusCode: 401
    responseTemplates:
      application/json: '{ "message": "Unauthorized" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
  ACCESS_DENIED:
    statusCode: 401
    responseTemplates:
      application/json: '{ "message": "Unauthorized" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

paths:
  /status:
    get:
      summary: Return service connections status
      operationId: status
      description: |
        Status message about the service connection
      tags:
        - Tool
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                type: object
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /clientes:
    get:
      summary: List clientes
      operationId: listClientes
      description: |
        Returns a paginated list of clientes via the sp_clientes_listar
        stored procedure.
      tags:
        - Clientes
      parameters:
        - name: limite
          in: query
          required: false
          description: Maximum number of rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of rows to skip before collecting the result set.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                type: object
                required:
                  - clientes
                properties:
                  clientes:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/cliente'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListClientesFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

    post:
      summary: Create a cliente
      operationId: createCliente
      description: |
        Creates a cliente via the sp_clientes_crear stored procedure and
        returns the resulting row.
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clienteInput'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cliente'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateClienteFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /clientes/{clienteId}:
    parameters:
      - name: clienteId
        in: path
        required: true
        description: Identifier of the cliente.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647

    get:
      summary: Get a cliente
      operationId: getCliente
      description: |
        Returns a single cliente via the sp_clientes_obtener stored procedure.
      tags:
        - Clientes
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cliente'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetClienteFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

    put:
      summary: Update a cliente
      operationId: updateCliente
      description: |
        Replaces the editable fields of a cliente via the
        sp_clientes_actualizar stored procedure.
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clienteInput'
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cliente'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateClienteFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

    delete:
      summary: Delete a cliente
      operationId: deleteCliente
      description: |
        Deletes a cliente via the sp_clientes_eliminar stored procedure.
      tags:
        - Clientes
      responses:
        '204':
          description: 'No Content'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteClienteFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

components:
  schemas:
    cliente:
      type: object
      required:
        - clienteId
        - nombre
        - email
      properties:
        clienteId:
          type: integer
          minimum: 1
          maximum: 2147483647
        nombre:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 180
        telefono:
          type: string
          nullable: true
          maxLength: 20
        creadoEn:
          type: string
          format: date-time

    clienteInput:
      type: object
      additionalProperties: false
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 180
        telefono:
          type: string
          nullable: true
          maxLength: 20

  responses:
    notFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string

    conflict:
      description: Conflict with the current state of the resource
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string

    unexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                enum:
                  - Something went wrong!
