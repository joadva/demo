openapi: 3.0.0
info:
  version: 1.0.0
  title: Demo
  description: Demo Global definitions of AWS SecretsManager
  contact:
    name: Demo

tags:
  - name: Tool
    description: Tool endpoints

servers:
  # Marcador de posicion. publish-docs.yaml lo reemplaza al publicar con
  # las URLs reales de los stacks desplegados, y el job de post-deploy le pasa
  # a Portman la suya con --baseUrl. Nadie deberia usar este valor.
  - url: https://reemplazar.execute-api.us-east-1.amazonaws.com/api
    description: Placeholder

x-amazon-apigateway-request-validators:
  Validate body, query string parameters, and headers:
    validateRequestParameters: true
    validateRequestBody: true

x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{ "message": "$context.error.validationErrorString" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
  UNAUTHORIZED:
    statusCode: 401
    responseTemplates:
      application/json: '{ "message": "Unauthorized" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
  ACCESS_DENIED:
    statusCode: 401
    responseTemplates:
      application/json: '{ "message": "Unauthorized" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

paths:
  /status:
    get:
      summary: Return service connections status
      operationId: status
      description: |
        Status message about the service connection
      tags:
        - Tool
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                type: object
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /ping:
    get:
      summary: Liveness check
      operationId: ping
      description: |
        Always answers 200. No depende de la base de datos ni de servicios
        externos, asi que sirve para verificar que el despliegue quedo vivo.
      tags:
        - Tool
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pong'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PingFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /info:
    get:
      summary: Service metadata
      operationId: info
      description: |
        Returns the service name, version and region. Solo lee variables de
        entorno, asi que tampoco depende de nada externo.
      tags:
        - Tool
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceInfo'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InfoFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /echo:
    post:
      summary: Echo the request body
      operationId: echo
      description: |
        Devuelve el mismo cuerpo que recibio. Util para comprobar de punta a
        punta el validador de peticiones y la integracion con la Lambda.
      tags:
        - Tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/echoInput'
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/echoOutput'
        '500':
          $ref: '#/components/responses/unexpectedError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EchoFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

components:
  schemas:
    pong:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          maxLength: 20
        timestamp:
          type: string
          format: date-time

    serviceInfo:
      type: object
      required:
        - service
        - version
        - region
        - timestamp
      properties:
        service:
          type: string
          maxLength: 60
        version:
          type: string
          maxLength: 20
        region:
          type: string
          maxLength: 30
        timestamp:
          type: string
          format: date-time

    echoInput:
      type: object
      additionalProperties: true
      properties:
        mensaje:
          type: string
          maxLength: 500

    echoOutput:
      type: object
      required:
        - receivedAt
        - payload
      properties:
        receivedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

  responses:
    unexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                enum:
                  - Something went wrong!
