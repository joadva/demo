version: 0.1
default:
  build:
    parameters:
      cached: 'true'
      parallel: 'true'
  deploy:
    parameters:
      stack_name: {{StackName}}
      capabilities: CAPABILITY_IAM
      parameter_overrides:
        - 'ReadSecretArn={{ReadSecretArn}}'
        - 'WriteSecretArn={{WriteSecretArn}}'
        - 'DatabaseKmsKeyArn={{DatabaseKmsKeyArn}}'
      image_repositories: []
