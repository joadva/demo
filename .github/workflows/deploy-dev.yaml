name: Deploy Dev
run-name: Deploy ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }} to Dev

on:
  # Push a dev despliega el ambiente compartido secrets-dev.
  push:
    branches:
      - dev
  # Cada Pull Request levanta su propio stack efimero, que cleanup-dev.yaml
  # elimina al cerrarlo.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: deploy-dev-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  pre-deploy-validations:
    name: Pre-Deployment
    uses: ./.github/workflows/pre-deploy-validations.yaml

  get-stack-name:
    name: Resolve Stack Name
    uses: ./.github/workflows/resolve-stack-name.yaml
    with:
      # El contexto env no esta disponible aqui, por eso el prefijo va literal.
      APP_NAME: demo-secrets
      # En un PR se calcula desde la rama; en push a dev se fuerza el fijo.
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
      STACK_NAME: ${{ github.event_name == 'push' && 'secrets-dev' || '' }}

  deploy-api:
    name: API Deployment
    needs: [pre-deploy-validations, get-stack-name]
    uses: ./.github/workflows/shared-deploy-api.yaml
    with:
      ENVIRONMENT: dev
      AWS_REGION: us-east-1
      STACK_NAME: ${{ needs.get-stack-name.outputs.STACK_NAME }}
    secrets: inherit

  post-deploy-validations:
    name: Post-Deployment
    needs: [deploy-api]
    uses: ./.github/workflows/post-deploy-validations.yaml
    with:
      ENVIRONMENT: dev
      BASE_URL: ${{ needs.deploy-api.outputs.API_BASE_URL }}
    secrets: inherit

  auto-merge-dependabot-update:
    name: Auto Merge Dependabot Update
    needs: [post-deploy-validations]
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Approve a PR if not already approved
        if: ${{ steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor' || steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' || steps.dependabot-metadata.outputs.package-ecosystem == 'github_actions' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout "$PR_URL" # sets the upstream metadata for `gh pr status`
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
