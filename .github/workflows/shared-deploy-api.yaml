name: Deploy API

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
      AWS_REGION:
        description: AWS Region the stack is being deployed to
        required: true
        type: string
      STACK_NAME:
        type: string
        default: demo-back
    outputs:
      API_BASE_URL:
        description: Base URL for the API that got deployed
        value: ${{ jobs.build-and-deploy.outputs.API_BASE_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy SAM Application
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    outputs:
      API_BASE_URL: ${{ steps.getStackOutputs.outputs.API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.AWS_REGION }}
          role-to-assume: ${{ vars.PIPELINE_EXECUTION_ROLE }}
          role-session-name: demo-deploy
          role-duration-seconds: 3600
          role-skip-session-tagging: true
      
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: npm-${{ hashFiles('package-lock.json', 'package.json') }}

      # Instalar dependencias
      - name: Install dependencies
        run: |
          if ! command -v esbuild >/dev/null 2>&1; then
            npm install -g esbuild
          fi
          if ! command -v replace-in-files-cli >/dev/null 2>&1; then
            npm install -g replace-in-files-cli
          fi
          npm ci
      
      # Cache para SAM build
      - name: Cache SAM Build
        id: cache-sam-build 
        uses: actions/cache@v4
        with:
          path: .aws-sam/build
          key: sam-build-${{ hashFiles('package.json', 'template.yaml', 'openapi.yaml', 'samconfig.ci.yaml', 'src/**') }}
    
      - name: Replace Variables in samconfig
        run: |
          replace-in-files --string='{{StackName}}' --replacement='${{ inputs.STACK_NAME }}' ./samconfig.ci.yaml
          replace-in-files --string='{{DBHost}}' --replacement='${{ secrets.DB_HOST }}' ./samconfig.ci.yaml
          replace-in-files --string='{{DBUser}}' --replacement='${{ secrets.DB_USER }}' ./samconfig.ci.yaml
          replace-in-files --string='{{DBPassword}}' --replacement='${{ secrets.DB_PASSWORD }}' ./samconfig.ci.yaml
          replace-in-files --string='{{DBPort}}' --replacement='${{ secrets.DB_PORT }}' ./samconfig.ci.yaml
          replace-in-files --string='{{DBDatabase}}' --replacement='${{ secrets.DB_DATABASE }}' ./samconfig.ci.yaml

      - name: SAM Build
        if: ${{ steps.cache-sam-build.outputs.cache-hit != 'true' }}
        run: |
          sam --info

          sam validate --lint

          sam build \
          --config-file samconfig.ci.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
          --config-file samconfig.ci.yaml \
          --s3-bucket ${{ vars.ARTIFACTS_BUCKET_NAME }} \
          --no-fail-on-empty-changeset \
          --role-arn ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}

      - id: getStackOutputs
        name: Get Stack Outputs
        run: |
          url=$(aws cloudformation describe-stacks --stack-name ${{ inputs.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ApiURL'].OutputValue" --output text)

          # Sin esta guarda, un ApiURL vacio se propaga hasta Portman, que
          # entonces cae al servers del contrato y falla con un DNS confuso.
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::El stack ${{ inputs.STACK_NAME }} no expuso el output ApiURL."
            exit 1
          fi

          echo "# API" >> $GITHUB_STEP_SUMMARY
          echo "* API: $url" >> $GITHUB_STEP_SUMMARY

          echo "API_BASE_URL=$url" >> $GITHUB_OUTPUT

      # Equivalente al amplify_outputs.json: convierte los Outputs del stack en
      # un JSON plano que el workflow del frontend descarga para construir
      # apuntando al API correcto, incluso en los stacks efimeros de cada PR.
      - name: Generate aws-exports.json
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ inputs.STACK_NAME }} \
            --query "Stacks[0].Outputs" --output json \
            | jq 'map({(.OutputKey): .OutputValue}) | add' > aws-exports.json

          cat aws-exports.json

      - name: Upload aws-exports.json
        uses: actions/upload-artifact@v4
        with:
          name: aws-exports-${{ inputs.STACK_NAME }}
          path: aws-exports.json
          if-no-files-found: error