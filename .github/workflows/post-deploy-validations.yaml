name: Post-deploy Validations

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
      BASE_URL:
        description: Base URL of the API that was just deployed
        required: true
        type: string

jobs:
  portman:
    name: Run Portman
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    # Portman exige 2xx en cada endpoint; sin una base de datos real, /status y
    # /clientes responden 500. Estas validaciones no deben tumbar un despliegue
    # que ya salio bien. Quitar esta linea cuando la base de datos este conectada.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: npm-${{ hashFiles('package-lock.json', 'package.json') }}

      # La API no tiene authorizer, asi que Portman corre sin token.
      # Si mas adelante se agrega un authorizer de Cognito, hay que volver a
      # configurar credenciales de AWS aqui y generar ./portman/.env-portman
      # con PORTMAN_BEARER_TOKEN antes de este paso.
      - name: Test API
        env:
          BASE_URL: ${{ inputs.BASE_URL }}
        run: |
          # Si BASE_URL llega vacia, Portman no falla: cae al bloque servers del
          # contrato, que es un marcador de posicion, y revienta con un ENOTFOUND
          # que no dice nada del problema real. Mejor detenerse aqui.
          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL vino vacia desde el job de despliegue."
            exit 1
          fi

          npm ci

          echo "### Postman / Portman Tests" >> $GITHUB_STEP_SUMMARY
          echo "* Base URL: $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          npx @apideck/portman --cliOptionsFile ./portman/portman-cli.json --baseUrl "$BASE_URL"

      - uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: collection.postman.json
          path: collection.postman.json
          if-no-files-found: ignore
