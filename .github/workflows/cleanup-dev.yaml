name: Cleanup Dev
run-name: Cleanup ${{ github.event_name == 'pull_request' && github.head_ref || github.event.ref || github.ref_name }}

on:
  delete:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      STACK_NAME:
        description: Stack a eliminar. Si se deja vacio se calcula desde la rama.
        required: false
        type: string
  workflow_call:
    inputs:
      STACK_NAME:
        description: Stack a eliminar. Si se deja vacio se calcula desde la rama.
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  get-stack-name:
    name: Resolve Stack Name
    # El evento delete tambien dispara al borrar etiquetas; solo interesan ramas.
    if: ${{ github.event_name != 'delete' || github.event.ref_type == 'branch' }}
    uses: ./.github/workflows/resolve-stack-name.yaml
    with:
      APP_NAME: demo-secrets
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'delete' && github.event.ref || github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
      STACK_NAME: ${{ inputs.STACK_NAME }}

  cleanup-resources:
    name: Cleanup Resources
    needs: [get-stack-name]
    if: ${{ needs.get-stack-name.outputs.STACK_NAME != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      STACK_NAME: ${{ needs.get-stack-name.outputs.STACK_NAME }}
      AWS_REGION: us-east-1
    steps:
      # Los stacks efimeros siempre llevan el prefijo demo-secrets-, asi que una
      # colision con los fijos no deberia ocurrir. Este freno existe porque el
      # nombre tambien puede llegar escrito a mano por workflow_dispatch.
      - name: Proteger los stacks fijos
        run: |
          case "$STACK_NAME" in
            secrets-dev|secrets-test|secrets-prod)
              echo "::error::Rechazado: $STACK_NAME es el stack fijo de un ambiente, no uno efimero."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.PIPELINE_EXECUTION_ROLE }}
          role-session-name: demo-cleanup
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Delete stack
        run: |
          # sam delete truena si el stack no existe, y eso pasa seguido:
          # ramas que nunca desplegaron, o limpiezas repetidas.
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            echo "El stack $STACK_NAME no existe; nada que borrar."
            echo "* El stack \`$STACK_NAME\` no existia." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          sam delete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-prompts

          echo "* Stack \`$STACK_NAME\` eliminado." >> $GITHUB_STEP_SUMMARY
