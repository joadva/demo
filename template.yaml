AWSTemplateFormatVersion: 2010-09-09
Description: demo-management-service
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Parameters:
  # ARN completo (con sufijo) de los secretos de Secrets Manager que guardan
  # las credenciales de MySQL. Se separan por permiso: las funciones que solo
  # consultan reciben el de lectura, las que modifican el de escritura, asi
  # una falla en un GET no puede escribir en la base.
  #
  # El secreto guarda un JSON con esta forma:
  #   { "connectionDetails": {
  #       "host": "...", "user": "...", "password": "...",
  #       "port": "3306", "database": "..." } }
  #
  # Si el secreto estuviera en otra cuenta hace falta ademas permiso kms:Decrypt
  # sobre su llave; ver docs/recursos-otra-cuenta.md.
  ReadSecretArn:
    Type: String
    NoEcho: true
    Description: Secreto con el usuario de MySQL de solo lectura

  WriteSecretArn:
    Type: String
    NoEcho: true
    Description: Secreto con el usuario de MySQL que puede escribir

  # Alternativa sin Secrets Manager: las credenciales como variables de entorno.
  # Ver la nota de createConnection en src/shared/database/index.mjs.
  #
  # DBHost:
  #   Type: String
  #   NoEcho: true
  # DBUser:
  #   Type: String
  #   NoEcho: true
  # DBPassword:
  #   Type: String
  #   NoEcho: true
  # DBPort:
  #   Type: String
  # DBDatabase:
  #   Type: String
  #   NoEcho: true

Globals:
  Function:
    Tracing: Active
    Timeout: 10
    Runtime: nodejs24.x
    MemorySize: 128
    Architectures:
      - arm64
  Api:
   Cors:
     AllowMethods: "'DELETE,GET,OPTIONS,PATCH,POST,PUT'"
     AllowHeaders: "'Content-Type,Authorization'"
     AllowOrigin: "'*'"

Resources:
  API:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./openapi.yaml

  # CRUD de /clientes-sam sobre la tabla y los stored procedures de sql/clientesSam.sql.
  # Cada funcion llama un solo procedimiento; la logica esta en su index.mjs.
  ListClientesSamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/clientesSam/list
      Handler: index.handler
      Timeout: 30
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /clientes-sam
            Method: GET
      Environment:
        Variables:
          DATABASE_CONNECTION_SECRET: !Ref ReadSecretArn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ReadSecretArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  CreateClienteSamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/clientesSam/create
      Handler: index.handler
      Timeout: 30
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /clientes-sam
            Method: POST
      Environment:
        Variables:
          DATABASE_CONNECTION_SECRET: !Ref WriteSecretArn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref WriteSecretArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  GetClienteSamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/clientesSam/get
      Handler: index.handler
      Timeout: 30
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /clientes-sam/{clienteId}
            Method: GET
      Environment:
        Variables:
          DATABASE_CONNECTION_SECRET: !Ref ReadSecretArn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ReadSecretArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  UpdateClienteSamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/clientesSam/update
      Handler: index.handler
      Timeout: 30
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /clientes-sam/{clienteId}
            Method: PUT
      Environment:
        Variables:
          DATABASE_CONNECTION_SECRET: !Ref WriteSecretArn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref WriteSecretArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  DeleteClienteSamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/clientesSam/delete
      Handler: index.handler
      Timeout: 30
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /clientes-sam/{clienteId}
            Method: DELETE
      Environment:
        Variables:
          DATABASE_CONNECTION_SECRET: !Ref WriteSecretArn
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref WriteSecretArn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

Outputs:
  # Estos outputs son la fuente del aws-exports.json que consume el frontend.
  # Todo lo que se agregue aqui aparece en ese archivo automaticamente.
  ApiURL:
    Description: API URL
    Value: !Sub https://${API}.execute-api.${AWS::Region}.amazonaws.com/api

  Region:
    Description: Region donde vive el API
    Value: !Ref AWS::Region

  StackName:
    Description: Nombre del stack que atiende estas rutas
    Value: !Ref AWS::StackName
