AWSTemplateFormatVersion: 2010-09-09
Description: demo-management-service
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Parameters:
  DBHost:
    Type: String
    NoEcho: true
  DBUser:
    Type: String
    NoEcho: true
  DBPassword:
    Type: String
    NoEcho: true
  DBPort:
    Type: String
  DBDatabase:
    Type: String
    NoEcho: true

Globals:
  Function:
    Tracing: Active
    Timeout: 10
    Runtime: nodejs24.x
    MemorySize: 128
    Architectures:
      - arm64
  Api:
   Cors:
     AllowMethods: "'DELETE,GET,OPTIONS,PATCH,POST,PUT'"
     AllowHeaders: "'Content-Type,Authorization'"
     AllowOrigin: "'*'"

Resources:
  # Alternativa con Secrets Manager. Desactivada porque cobra ~0.40 USD por
  # secreto al mes solo por existir, aunque nunca se consulte. Hoy las
  # credenciales viajan como variables de entorno de cada funcion.
  #
  # Para volver a ella hay que hacer cuatro cosas:
  #   1. Descomentar este recurso y el output DatabaseConnectionSecretArn.
  #   2. En cada funcion, cambiar las cinco variables DB_* por
  #      DATABASE_CONNECTION_SECRET: !Ref DatabaseConnectionSecret
  #   3. En cada funcion, devolver el permiso sobre el secreto:
  #        - Version: 2012-10-17
  #          Statement:
  #            - Effect: Allow
  #              Action:
  #                - secretsmanager:GetSecretValue
  #              Resource:
  #                - !Ref DatabaseConnectionSecret
  #   4. En src/shared/database/index.mjs, leer las credenciales con
  #      getSecret(process.env.DATABASE_CONNECTION_SECRET, { transform: 'json' })
  #      en lugar de process.env.
  #
  # DatabaseConnectionSecret:
  #   Type: AWS::SecretsManager::Secret
  #   DeletionPolicy: Delete
  #   UpdateReplacePolicy: Delete
  #   Properties:
  #     Description: Database connection variables
  #     SecretString:
  #       Fn::ToJsonString:
  #         connectionDetails:
  #           host: !Ref DBHost
  #           user: !Ref DBUser
  #           password: !Ref DBPassword
  #           port: !Ref DBPort
  #           database: !Ref DBDatabase

  API:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./openapi.yaml

  # Endpoints sin dependencias externas: no leen base de datos ni servicios de
  # terceros, por eso siempre responden 200 y sirven para validar el despliegue.
  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/ping
      Handler: index.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /ping
            Method: GET
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  InfoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/info
      Handler: index.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /info
            Method: GET
      Environment:
        Variables:
          SERVICE_NAME: demo-api
          SERVICE_VERSION: 1.0.0
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  EchoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/echo
      Handler: index.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /echo
            Method: POST
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/status
      Handler: index.handler
      Timeout: 30
      Events:
        EchoEvent:
          Type: Api
          Properties:
            RestApiId: !Ref API
            Path: /status
            Method: GET
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          DB_PORT: !Ref DBPort
          DB_DATABASE: !Ref DBDatabase
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Minify: false
        OutExtension:
          - .js=.mjs
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

Outputs:
  # Estos outputs son la fuente del aws-exports.json que consume el frontend.
  # Todo lo que se agregue aqui aparece en ese archivo automaticamente.
  ApiURL:
    Description: API URL
    Value: !Sub https://${API}.execute-api.${AWS::Region}.amazonaws.com/api

  Region:
    Description: Region donde vive el API
    Value: !Ref AWS::Region

  StackName:
    Description: Nombre del stack que atiende estas rutas
    Value: !Ref AWS::StackName

  # Ver la nota del recurso DatabaseConnectionSecret en la seccion Resources.
  #
  # DatabaseConnectionSecretArn:
  #   Description: ARN of the DatabaseConnectionSecret
  #   Value: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DatabaseConnectionSecret}
  #   Export:
  #     Name: !Sub "DatabaseConnectionSecretArn-${AWS::StackName}"
